services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - ai-service
    command: npm run dev
